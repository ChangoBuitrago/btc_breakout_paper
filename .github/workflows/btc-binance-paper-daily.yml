name: BTC Binance Paper Daily

on:
  schedule:
    # Binance daily candles close at 00:00 UTC. Run shortly after.
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  run-paper-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL || 'https://api.binance.com' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas yfinance

      - name: Restore previous paper state
        uses: actions/cache@v4
        with:
          path: btc_breakout_clean/paper_binance/
          key: btc-binance-paper-${{ github.run_id }}
          restore-keys: |
            btc-binance-paper-

      - name: Run Binance paper bot
        run: |
          python btc_breakout_clean/run_binance_paper_daily.py --base-url "$BINANCE_BASE_URL"

      - name: Upload paper state
        uses: actions/upload-artifact@v4
        with:
          name: btc-binance-paper-state
          path: btc_breakout_clean/paper_binance/
          retention-days: 90
